name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        shell: cmd
        run: |
          java -version

      - name: Verify Maven
        shell: cmd
        run: |
          C:\Tools\apache-maven-3.9.16\bin\mvn.cmd -version

      - name: Build
        shell: cmd
        run: |
          C:\Tools\apache-maven-3.9.16\bin\mvn.cmd clean package

      - name: Deploy
        shell: powershell
        run: .\scripts\deploy.ps1